name: CI

# Unit tests on every pull request and on pushes to main. Selftest and snapshots
# stay local: they need a signed .app and a display.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    # Trusted events (push / same-repo PRs) use the atreides self-hosted runner.
    # Fork PRs stay on GitHub-hosted macos-26 so untrusted code never runs on the Mac.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: swift test --scratch-path "$RUNNER_TEMP/MacMinion-test-build"
