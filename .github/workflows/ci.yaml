name: CI

# Unit tests on every pull request and on pushes to main. Selftest and snapshots
# stay local: they need a signed .app and a display.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    # Self-hosted only for push to main (workflow from the default branch). Every pull_request
    # stays on GitHub-hosted macos-26: PR workflows come from the merge commit, so a fork could
    # otherwise rewrite runs-on and land on atreides.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-26' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: swift test --scratch-path "$RUNNER_TEMP/MacMinion-test-build"
